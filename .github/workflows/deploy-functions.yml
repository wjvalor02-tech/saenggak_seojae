# supabase/functions/ 가 바뀐 채로 main에 푸시되면 Supabase Edge Function을 자동 배포한다.
# 필요한 저장소 비밀값(Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  Supabase 대시보드 → Account → Access Tokens 에서 발급
#   SUPABASE_PROJECT_ID    프로젝트 ref (예: https://<ref>.supabase.co 의 <ref>)
# AI 키(GEMINI_API_KEY 등)는 여기서 다루지 않는다. Supabase의 Edge Function Secrets에 그대로 둔다.
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능

permissions:
  contents: read

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN 또는 SUPABASE_PROJECT_ID 비밀값이 없습니다."
            exit 1
          fi

      # supabase/functions/ 안의 모든 함수를 배포
      #   --use-api: Docker 없이 서버에서 번들링
      #   --yes: CI에는 확인 질문에 답할 터미널이 없으므로 자동 승인
      - name: Deploy functions
        run: supabase functions deploy --remote="$SUPABASE_PROJECT_ID" --use-api --yes
